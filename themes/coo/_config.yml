# Exibe os botões "Estrela no GitHub", "Siga-nos no X" e "Pague um café"
# nos posts, nas páginas e na home. Defina true para reativar.
social_buttons: false

# Limite de artigos recentes
recent_posts_limits: 4

# Categorias e ordem exibidas na página inicial
index_categories:
  - IA
  - Programação
  - Ferramentas
  - Sistema Operacional
  - Comandos Linux
  - Python
  - Banco de Dados
  - Atalhos de Teclado
  - Jogos
  - Outros

# Posts recomendados na página inicial
index_recommends:
  - chatgpt
  - bash
  - python
  - javascript
  - go
  - vim
  - regex
  - awk

# Posts populares relacionados
# Dependências: https://github.com/tea3/hexo-related-popular-posts
related_posts:
  enable: true
  title: Relacionados
  params:
    maxCount: 4
    #PPMixingRate: 0.0
    #isDate: false
    #isImage: false
    #isExcerpt: false

top_posts:
  enable: true
  title: Mais populares
  params:
    maxCount: 4
    PPMixingRate: 1.0
