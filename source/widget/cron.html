<body>
  <div class="container">
    <h1 class="text-center font-bold">Gerador simples de expressão CRON</h1>
    <div class="input-section">
      <p class="mb-2 indent-3 font-medium">Digite a data e a hora da expressão:</p>
      <table class="p-2 text-center">
        <tbody class="mb-2 flex justify-center gap-4">
          <tr>
            <td>
              <input
                class="rounded border border-gray-300 p-2 text-center"
                id="from-minute"
                type="text"
                placeholder="Minuto : 0-59 ou *"
                aria-label="Minuto"
              />
            </td>
            <td>
              <input
                class="rounded border border-gray-300 p-2 text-center"
                id="from-hour"
                type="text"
                placeholder="Hora : 0-23 ou *"
                aria-label="Hora"
              />
            </td>
            <td>
              <input
                class="rounded border border-gray-300 p-2 text-center"
                id="from-day-of-month"
                type="text"
                placeholder="Dia do mês : 1-31 ou *"
                aria-label="Dia do mês"
              />
            </td>
            <td>
              <select
                class="rounded border border-gray-300 p-2 text-center"
                id="from-month"
                aria-label="Mês"
              >
                <option value="*">Qualquer mês</option>
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
              </select>
            </td>
            <td>
              <select
                class="rounded border border-gray-300 p-2 text-center"
                id="from-day-of-week"
                aria-label="Dia da semana"
              >
                <option value="*">Qualquer dia</option>
                <option value="0">Domingo</option>
                <option value="1">Segunda-feira</option>
                <option value="2">Terça-feira</option>
                <option value="3">Quarta-feira</option>
                <option value="4">Quinta-feira</option>
                <option value="5">Sexta-feira</option>
                <option value="6">Sábado</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="button-section flex justify-center gap-4">
        <div>
          <button
            id="generateBtn"
            class="btn rounded bg-green-500 px-3 py-1 text-white hover:bg-green-600"
          >
            Gerar
          </button>
        </div>
        <div>
          <button
            id="clearBtn"
            class="btn rounded bg-red-500 px-3 py-1 text-white hover:bg-green-600"
          >
            Limpar
          </button>
        </div>
      </div>
    </div>
    <hr class="mb-2 mt-2" />
    <div class="result-section">
      <p class="mb-2 indent-3 font-medium">Expressão CRON gerada:</p>
      <div
        class="cron-expression mb-2 rounded border-gray-300 p-2 text-center"
        id="cron-expression"
      >
        * * * * *
      </div>
      <div class="flex justify-center">
        <button
          id="copyBtn"
          class="btn rounded bg-green-500 px-3 py-1 text-white hover:bg-green-600"
        >
          Copiar CRON
        </button>
      </div>
    </div>
    <hr class="mb-2 mt-2" />
    <div class="description-section">
      <p class="indent-3 font-medium">Descrição:</p>
      <p id="cron-description" class="mb-4 text-center text-sky-500">
        Selecione os valores para gerar uma expressão cron.
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/cronstrue@latest/dist/cronstrue.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const minuteInput = document.getElementById('from-minute');
      const hourInput = document.getElementById('from-hour');
      const domInput = document.getElementById('from-day-of-month');
      const monthSelect = document.getElementById('from-month');
      const dowSelect = document.getElementById('from-day-of-week');
      const cronExprDiv = document.getElementById('cron-expression');
      const descriptionPara = document.getElementById('cron-description');
      const generateBtn = document.getElementById('generateBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyBtn = document.getElementById('copyBtn');

      function generateCron() {
        const minute = minuteInput.value.trim() || '*';
        const hour = hourInput.value.trim() || '*';
        const dom = domInput.value.trim() || '*';
        const month = monthSelect.value;
        const dow = dowSelect.value;

        const cronString = `${minute} ${hour} ${dom} ${month} ${dow}`;

        cronExprDiv.textContent = cronString;

        try {
          const description = cronstrue.toString(cronString);
          descriptionPara.textContent = description;
        } catch (e) {
          descriptionPara.textContent = 'Expressão cron inválida.';
        }
      }

      function clearInputs() {
        minuteInput.value = '';
        hourInput.value = '';
        domInput.value = '';
        monthSelect.value = '*';
        dowSelect.value = '*';
        cronExprDiv.textContent = '* * * * *';
        descriptionPara.textContent = 'Selecione os valores para gerar uma expressão cron.';
      }

      function copyToClipboard() {
        const cronText = cronExprDiv.textContent;
        navigator.clipboard.writeText(cronText);
      }

      generateBtn.addEventListener('click', generateCron);
      clearBtn.addEventListener('click', clearInputs);
      copyBtn.addEventListener('click', copyToClipboard);

      generateCron();
    });
  </script>
</body>
