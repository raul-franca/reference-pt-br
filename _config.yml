# Configuração do Hexo
## Documentação: https://hexo.io/docs/configuration.html
## Código-fonte: https://github.com/hexojs/hexo/

# Site
title: CheatSheets.zip
subtitle: "A referência definitiva para desenvolvedores"
description: "Referências rápidas e cheat sheets para desenvolvedores"
keywords: cheat,sheet,cheatsheets,reference,programming,code table,snippets,linux,command,shortcuts,developers,referência,programação,comandos,atalhos,desenvolvedores
author: Fechin
language: pt-BR
timezone: "UTC"

# URL
## Se o site ficar em um subdiretório, defina url como 'http://yoursite.com/child' e root como '/child/'
url: https://cheatsheets.zip
root: /
permalink: :name.html
permalink_defaults:
pretty_urls:
  trailing_index: false # Defina como false para remover o 'index.html' final dos permalinks
  trailing_html: true # Defina como false para remover o '.html' final dos permalinks

# Diretórios
source_dir: source
public_dir: public
#tag_dir: tag
archive_dir: archives
#category_dir: node
#code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "assets/**/*"

# Escrita
new_post_name: :title.md # Nome do arquivo de novos posts
default_layout: post
titlecase: false # Converte o título para title case
external_link:
  enable: true # Abre links externos em nova aba
  field: site # Aplica ao site inteiro
  exclude: ""
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: # vazio para desativar o syntax highlighting nativo
highlight:
  enable: false

# Configuração da página inicial
# path: caminho Root da página inicial do blog. (padrão = '')
# per_page: posts exibidos por página. (0 = desativa a paginação)
# order_by: ordenação dos posts. (por padrão, data decrescente)
index_generator:
  path: ""
  per_page: 0
  order_by: -date

# Categoria e tag
default_category: Sem categoria
category_map: {}
tag_map: {}

# Elementos de metadados
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: false

# Configuração de SEO
seo:
  # Imagem padrão para compartilhamento social
  default_image: "/assets/image/preview.png"
  # Informações do autor
  author_name: "Fechin"
  author_url: "https://cheatsheets.zip"
  # Configuração de redes sociais
  social:
    twitter: "Fechin"
    github: "Fechin/reference"
  # Tipo de site
  site_type: "Plataforma de tecnologia educacional"
  # Público-alvo
  target_audience: "Desenvolvedores, programadores e administradores de sistemas"

# Formato de data e hora
## O Hexo usa Moment.js para interpretar e exibir datas
## Personalize o formato de data conforme
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## Usa a data do post como data de atualização, a menos que definido no front matter
updated_option: "date"

# Paginação
## Defina per_page como 0 para desativar a paginação
per_page: 10
pagination_dir: page

# Arquivos incluídos/excluídos
## As opções include:/exclude: se aplicam apenas à pasta 'source/'
include: []
exclude:
  - ".github"
ignore: []

# Extensões
## Plugins: https://hexo.io/plugins/
## Temas: https://hexo.io/themes/
theme: coo

nofollow:
  enable: true
  field: site
  exclude:
    - "tableconvert.com"
    - "sbti.now"
    - "fionaai.com"
    - "github.com"
    - "gospinwheel.com"
    - "colorscreen.co"
    - "sshkeygenerator.com"
    - "x.com"
    - "myip.dog"

excerpt:
  depth: 2
  excerpt_excludes: []
  more_excludes: []
  hideWholePostExcerpts: true

# Deploy
## Documentação: https://hexo.io/docs/deployment.html
deploy:
  - type: cjh_bing_url_submitter
  - type: cjh_baidu_url_submitter

# Configuração do hexo-server
server:
  # Corrige o problema de o refresh em tempo real falhar ocasionalmente e de artigos longos serem truncados
  compress: true

# https://github.com/hexojs/hexo-generator-sitemap#options
sitemap:
  path: sitemap.xml
  tags: false
  categories: false

# Configuração do Markdown-it
## Documentação: https://github.com/celsomiranda/hexo-renderer-markdown-it/wiki
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: false
    typographer: false
    quotes: "“”‘’"
    langPrefix: "hljs language-"
  anchors:
    level: 2
    collisionSuffix: ""
    permalink: true
    permalinkClass: h-anchor
    permalinkSymbol: "#"
    case: 1
    separator: "-"

# Configuração do Browsersync
browsersync:
  ui: false # desativa a UI
  notify: false # desativa a notificação
  logLevel: silent # define o nível de log como silencioso
